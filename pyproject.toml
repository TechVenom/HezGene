[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hezgene"
version = "1.0.6"
description = "Autonomous genetic software evolution — code that improves itself"
readme = "README.md"
license = "MIT"
keywords = ["evolution", "genetic", "self-improving", "optimization", "autonomous"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "rich-click>=1.7",
    "psutil>=5.9",
    "gitpython>=3.1",
    "ast-comments>=1.2",
    "fastapi>=0.104",
    "uvicorn>=0.23",
    "websockets>=11.0",
]

[project.optional-dependencies]
llm-openai = ["openai>=1.0"]
llm-anthropic = ["anthropic>=0.18"]
llm-google = ["google-generativeai>=0.4"]
all-llm = [
    "openai>=1.0",
    "anthropic>=0.18",
    "google-generativeai>=0.4",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "black>=23.0",
]

[project.scripts]
hezgene = "hezgene.cli:main"
hezgene-demo = "hezgene.demo:main"

[project.urls]
Homepage = "https://github.com/TechVenom/HezGene"
Documentation = "https://hezgene.vercel.app/docs/introduction"
Repository = "https://github.com/TechVenom/HezGene.git"
Issues = "https://github.com/TechVenom/HezGene/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
